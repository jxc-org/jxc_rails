# Standalone gitleaks scan. jxc_rails is the org's only public repo, and
# public repos cannot call reusable workflows in the private jxc-org/.github
# repo — the shared `uses:` form fails at workflow startup with zero jobs.
# This inlines the same steps as jxc-org/.github/.github/workflows/gitleaks.yml.
name: gitleaks
on:
  push:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: homeserver-linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          ver="8.30.1"
          mkdir -p "$HOME/.local/bin"
          if ! command -v gitleaks >/dev/null 2>&1; then
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o /tmp/gl.tgz
            tar -xzf /tmp/gl.tgz -C "$HOME/.local/bin" gitleaks
            chmod +x "$HOME/.local/bin/gitleaks"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Scan
        run: |
          if [ -f Makefile ] && grep -qE '^scan:' Makefile; then
            make scan
          else
            gitleaks dir . --no-banner --redact
          fi
