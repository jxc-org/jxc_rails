name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    # GitHub-hosted, literal, on purpose (HOMES-221): jxc_rails is public, and
    # self-hosted runners are private-repos-only. A fork PR must never land on
    # a home-LAN runner, so this job does not read CI_RUNNER. Hosted minutes
    # are free for public repos.
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.4.8'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
